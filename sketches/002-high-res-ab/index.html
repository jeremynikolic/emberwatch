<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emberwatch — 1× vs 2× Source Resolution</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #080d17; color: #d8dedc; }
  body { display: grid; place-items: center; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow: hidden; }
  canvas { width: 1280px; height: 720px; max-width: 100vw; max-height: 100vh; object-fit: contain; image-rendering: pixelated; box-shadow: 0 0 0 2px #b78845, 0 20px 70px #000b; }
  .hint { position: fixed; bottom: 6px; right: 10px; color: #8e9aa0; font: 11px ui-monospace, monospace; pointer-events: none; }
</style>
</head>
<body>
<canvas id="view" width="1280" height="720" aria-label="Emberwatch source-resolution comparison"></canvas>
<div class="hint">Click DAY / NIGHT</div>
<script>
const canvas = document.getElementById('view');
const c = canvas.getContext('2d');
c.imageSmoothingEnabled = false;
const P = {
  void:'#080d17', navy:'#0d1727', panel:'#142338', panel2:'#1b2d42', brass:'#b78845', brassHi:'#e0b865',
  grass:'#425745', grass2:'#50654c', grid:'#354b3e', earth:'#66533d', path:'#776b56', pathHi:'#9b8a6c',
  text:'#d9dfdc', muted:'#8e9aa0', ember:'#ee7e32', flame:'#ffd275', stone:'#59666b', stoneHi:'#929da0',
  crimson:'#e05758', ice:'#73c9cf'
};
const sources = {
  lowWatch:'../001-style-lock/assets/watchfire.png', lowBomb:'../001-style-lock/assets/bombard.png',
  highWatch:'assets/watchfire-2x.png', highBomb:'assets/bombard-2x.png'
};
const assets = {}; let night = false;
function rect(x,y,w,h,color){ c.fillStyle=color; c.fillRect(x|0,y|0,w|0,h|0); }
function line(x1,y1,x2,y2,color,w=1){ c.strokeStyle=color; c.lineWidth=w; c.beginPath(); c.moveTo(x1+.5,y1+.5); c.lineTo(x2+.5,y2+.5); c.stroke(); }
function text(s,x,y,color=P.text,size=14,align='left'){ c.fillStyle=color; c.font=`bold ${size}px ui-monospace, monospace`; c.textAlign=align; c.textBaseline='top'; c.fillText(s,x,y); }
function bevel(x,y,w,h,fill=P.panel){ rect(x,y,w,h,P.brass); rect(x+2,y+2,w-4,h-4,P.navy); rect(x+4,y+4,w-8,h-8,fill); }
function terrain(x,y,w,h){
  rect(x,y,w,h,P.grass);
  for(let yy=y; yy<y+h; yy+=32){
    for(let xx=x; xx<x+w; xx+=32){
      const n=((xx/32)*13+(yy/32)*7)%9;
      if(n===0) rect(xx+7,yy+9,5,2,P.grass2);
      if(n===3) rect(xx+23,yy+19,3,2,'#687451');
      line(xx,y,xx,y+h,P.grid,1); line(x,yy,x+w,yy,P.grid,1);
    }
  }
  line(x+w,y,x+w,y+h,P.grid,1); line(x,y+h,x+w,y+h,P.grid,1);
  // Identical route approaching the Watchfire.
  const cells=[[0,4],[1,4],[2,4],[3,4],[4,4],[5,4],[5,5],[5,6],[6,6],[7,6],[8,6],[9,6],[10,6],[11,6],[12,6],[12,7],[12,8],[11,8]];
  for(const [gx,gy] of cells){ rect(x+gx*32,y+gy*32,32,32,P.path); rect(x+gx*32,y+gy*32,32,3,P.pathHi); }
  // A few blocked highland props.
  rect(x+36,y+56,24,12,'#354147'); rect(x+40,y+48,16,12,P.stone); rect(x+44,y+46,9,4,P.stoneHi);
  rect(x+285,y+52,6,32,'#59402d'); rect(x+269,y+54,38,25,'#2b4438'); rect(x+276,y+40,25,24,'#35503e');
}
function worker(x,y){ rect(x+8,y,8,8,P.flame); rect(x+5,y+8,14,16,P.navy); rect(x+7,y+24,4,8,'#76503a'); rect(x+15,y+24,4,8,'#76503a'); rect(x+20,y+8,2,18,P.stoneHi); rect(x+18,y+6,8,4,P.stone); }
function scene(panelX, mode){
  const worldX=panelX+20, worldY=150, worldW=560, worldH=384;
  terrain(worldX,worldY,worldW,worldH);
  // Same exact 2x2 and 3x3 tile footprints in both panels.
  const bombX=worldX+192, bombY=worldY+224, fireX=worldX+384, fireY=worldY+256;
  c.setLineDash([5,5]); c.strokeStyle='#e0b86577'; c.lineWidth=2; c.beginPath(); c.arc(bombX+32,bombY+32,92,0,Math.PI*2); c.stroke(); c.setLineDash([]);
  if(mode==='low'){
    c.drawImage(assets.lowBomb,bombX,bombY,64,64);
    c.drawImage(assets.lowWatch,fireX,fireY,96,96);
  } else {
    c.drawImage(assets.highBomb,bombX,bombY);
    c.drawImage(assets.highWatch,fireX,fireY);
  }
  worker(bombX-24,bombY+35);
  text('BOMBARD',bombX+32,bombY+69,P.text,12,'center'); text('WATCHFIRE',fireX+48,fireY+101,P.flame,12,'center');
  if(night){
    c.globalAlpha=.48; rect(worldX,worldY,worldW,worldH,'#07142d'); c.globalAlpha=1;
    c.globalAlpha=.15; rect(fireX-22,fireY-18,140,128,P.ember); c.globalAlpha=1;
    rect(fireX+46,fireY+43,6,18,P.flame); rect(fireX+48,fireY+38,3,14,'#fff1b1');
  }
  // Footprint ruler.
  line(bombX,bombY+105,bombX+64,bombY+105,P.brassHi,2); line(bombX,bombY+100,bombX,bombY+110,P.brassHi,2); line(bombX+64,bombY+100,bombX+64,bombY+110,P.brassHi,2);
  text('64 PX ON SCREEN · 2×2 TILES',bombX+32,bombY+114,P.muted,10,'center');
}
function card(x,title,subtitle,mode,recommend=false){
  bevel(x,82,600,570,recommend?'#182f3c':P.panel);
  text(title,x+24,101,recommend?P.flame:P.text,24); text(subtitle,x+24,130,P.muted,12);
  if(recommend){ bevel(x+454,96,120,28,'#263f3d'); text('PROPOSED',x+514,104,'#9fd29a',12,'center'); }
  scene(x,mode);
  const baseY=562;
  text(mode==='low'?'32×32 SOURCE → 64×64 DISPLAY':'64×64 SOURCE → 64×64 DISPLAY',x+24,baseY,P.text,14);
  text(mode==='low'?'4 display pixels repeat each art pixel':'1 source pixel maps to 1 display pixel',x+24,baseY+23,P.muted,12);
  text(mode==='low'?'Strong silhouette · limited surface detail':'More material, light, and mechanism detail',x+24,baseY+45,mode==='low'?P.brassHi:'#9fd29a',12);
}
function draw(){
  rect(0,0,1280,720,P.void); rect(0,0,1280,62,P.navy); rect(0,60,1280,2,P.brass);
  text('EMBERWATCH · SOURCE RESOLUTION TEST',28,17,P.flame,22);
  text('Same footprint · same palette · same on-screen size',1250,22,P.muted,13,'right');
  card(20,'A · CURRENT 1× SOURCE','Nearest-neighbour enlargement','low');
  card(660,'B · TRUE 2× SOURCE','Higher-resolution authored sprite','high',true);
  bevel(548,670,184,34,P.panel2); text(night?'SWITCH TO DAY':'SWITCH TO NIGHT',640,679,P.text,13,'center');
}
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect(); const x=(e.clientX-r.left)*1280/r.width, y=(e.clientY-r.top)*720/r.height;
  if(x>=548&&x<=732&&y>=670&&y<=704){ night=!night; draw(); }
});
async function boot(){
  await Promise.all(Object.entries(sources).map(([name,src])=>new Promise((resolve,reject)=>{
    const im=new Image(); im.onload=()=>{ assets[name]=im; resolve(); }; im.onerror=reject; im.src=src;
  })));
  draw(); window.mockReady=true;
}
boot();
</script>
</body>
</html>
